<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">RTSP Camera Viewer</title>
  <desc id="desc">A stylized dashboard screenshot of the RTSP camera viewer application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d1724"/>
      <stop offset="100%" stop-color="#0f1521"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#101b2a"/>
      <stop offset="100%" stop-color="#0b1420"/>
    </linearGradient>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#0b1827"/>
      <stop offset="100%" stop-color="#101d2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#65d7ff"/>
      <stop offset="100%" stop-color="#7ae0a5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <rect x="0" y="0" width="1200" height="32" fill="#111821" opacity="0.95"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="36" cy="16" r="6" fill="#ffbd2e"/>
  <circle cx="54" cy="16" r="6" fill="#28c840"/>
  <text x="630" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dfeaf6">Mon Oct 5  •  2:47 PM</text>
  <rect x="865" y="8" width="110" height="16" rx="8" fill="#1d2a39"/>
  <circle cx="881" cy="16" r="4" fill="#7ae0a5"/>
  <circle cx="963" cy="16" r="4" fill="#7cc7ff"/>

  <g filter="url(#shadow)">
    <rect x="38" y="52" width="220" height="660" rx="18" fill="#0d1824"/>
    <rect x="257" y="52" width="905" height="660" rx="18" fill="url(#panel)"/>
  </g>

  <rect x="260" y="52" width="900" height="54" rx="18" fill="url(#header)"/>
  <rect x="285" y="68" width="170" height="22" rx="11" fill="#1b2838"/>
  <text x="305" y="83" font-family="Arial, sans-serif" font-size="12" fill="#dfeaf6">github.com/alan5ab/rtsp-camera-viewer</text>

  <g>
    <rect x="292" y="122" width="86" height="32" rx="8" fill="#152232"/>
    <text x="335" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#dfeaf6">Code</text>
    <rect x="382" y="122" width="108" height="32" rx="8" fill="#122131"/>
    <text x="436" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#dfeaf6">Issues</text>
    <rect x="495" y="122" width="116" height="32" rx="8" fill="#122131"/>
    <text x="553" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#dfeaf6">Pull requests</text>
    <rect x="616" y="122" width="102" height="32" rx="8" fill="#122131"/>
    <text x="667" y="143" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#dfeaf6">Actions</text>
  </g>

  <g>
    <rect x="0" y="0" width="220" height="530" fill="#0d1824"/>
    <rect x="20" y="84" width="180" height="130" rx="12" fill="#1a2f41"/>
    <rect x="18" y="84" width="184" height="14" rx="7" fill="#0f2232"/>
    <rect x="36" y="105" width="148" height="78" rx="9" fill="#223b4d"/>
    <rect x="40" y="111" width="132" height="68" rx="7" fill="#294d5a"/>
    <rect x="44" y="116" width="124" height="58" rx="6" fill="#173b46" />
    <rect x="48" y="120" width="64" height="50" rx="4" fill="#b9d9ce" opacity="0.7"/>
    <rect x="116" y="120" width="48" height="50" rx="4" fill="#7fc2ff" opacity="0.6"/>
    <text x="28" y="232" font-family="Arial, sans-serif" font-size="11" fill="#d8ebf7">Cameras</text>

    <g transform="translate(24,250)">
      <rect width="172" height="54" rx="10" fill="#132536"/>
      <rect x="12" y="12" width="62" height="30" rx="6" fill="#243a4a"/>
      <rect x="84" y="12" width="70" height="10" rx="5" fill="#95adc0" opacity="0.8"/>
      <rect x="84" y="26" width="44" height="8" rx="4" fill="#6d7f8d" opacity="0.8"/>
    </g>
    <g transform="translate(24,312)">
      <rect width="172" height="54" rx="10" fill="#132536"/>
      <rect x="12" y="12" width="62" height="30" rx="6" fill="#243a4a"/>
      <rect x="84" y="12" width="70" height="10" rx="5" fill="#95adc0" opacity="0.8"/>
      <rect x="84" y="26" width="44" height="8" rx="4" fill="#6d7f8d" opacity="0.8"/>
    </g>
    <g transform="translate(24,374)">
      <rect width="172" height="54" rx="10" fill="#132536"/>
      <rect x="12" y="12" width="62" height="30" rx="6" fill="#243a4a"/>
      <rect x="84" y="12" width="70" height="10" rx="5" fill="#95adc0" opacity="0.8"/>
      <rect x="84" y="26" width="44" height="8" rx="4" fill="#6d7f8d" opacity="0.8"/>
    </g>
    <g transform="translate(24,436)">
      <rect width="172" height="54" rx="10" fill="#132536"/>
      <rect x="12" y="12" width="62" height="30" rx="6" fill="#243a4a"/>
      <rect x="84" y="12" width="70" height="10" rx="5" fill="#95adc0" opacity="0.8"/>
      <rect x="84" y="26" width="44" height="8" rx="4" fill="#6d7f8d" opacity="0.8"/>
    </g>
  </g>

  <g>
    <rect x="286" y="176" width="820" height="476" rx="16" fill="#0d1722"/>
    <rect x="300" y="190" width="650" height="22" rx="11" fill="#111f2d"/>
    <circle cx="320" cy="201" r="6" fill="#67d1ff"/>
    <circle cx="339" cy="201" r="6" fill="#8dc4ff"/>
    <text x="352" y="206" font-family="Arial, sans-serif" font-size="12" fill="#dfeaf6">main</text>
    <rect x="430" y="195" width="98" height="12" rx="6" fill="#1a2b3a"/>
    <rect x="620" y="194" width="120" height="14" rx="7" fill="#1c3042"/>
    <rect x="740" y="194" width="90" height="14" rx="7" fill="#1c3042"/>

    <text x="318" y="260" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#edf5ff">rtsp-camera-viewer</text>
    <rect x="318" y="275" width="760" height="1.5" fill="#1d2d3d"/>

    <g>
      <rect x="318" y="300" width="668" height="130" rx="10" fill="#0e1a27"/>
      <text x="336" y="330" font-family="Arial, sans-serif" font-size="17" fill="#edf5ff">Desktop-side vertical webcam viewer for Ubuntu 24.04/26.04 Wayland.</text>
      <text x="336" y="360" font-family="Arial, sans-serif" font-size="17" fill="#edf5ff">This project shows a slim column of camera thumbnails, reconnects</text>
      <text x="336" y="390" font-family="Arial, sans-serif" font-size="17" fill="#edf5ff">automatically, and opens a full browser view for any camera when you</text>
      <text x="336" y="420" font-family="Arial, sans-serif" font-size="17" fill="#edf5ff">click its tile.</text>
    </g>

    <g>
      <text x="318" y="468" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#edf5ff">Features</text>
      <g font-family="Arial, sans-serif" font-size="18" fill="#dbe8f5">
        <circle cx="336" cy="490" r="4" fill="#6dd1ff"/>
        <text x="350" y="496">Vertical sidebar camera dashboard</text>
        <circle cx="336" cy="525" r="4" fill="#6dd1ff"/>
        <text x="350" y="531">Hardware-accelerated H.264 decoding</text>
        <circle cx="336" cy="560" r="4" fill="#6dd1ff"/>
        <text x="350" y="566">go2rtc-based RTSP substreams</text>
      </g>
    </g>

    <g>
      <rect x="1010" y="188" width="76" height="30" rx="8" fill="#132230"/>
      <text x="1048" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dfeaf6">Star</text>
      <rect x="1088" y="188" width="80" height="30" rx="8" fill="#132230"/>
      <text x="1128" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dfeaf6">Fork</text>
    </g>
