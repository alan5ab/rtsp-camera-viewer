    <text x="721" y="236" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dfeaf6">Go to file</text>
  </g>

  <g>
    <rect x="290" y="144" width="156" height="26" rx="8" fill="#101e2c"/>
    <text x="368" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#dfeaf6">main</text>
  </g>
